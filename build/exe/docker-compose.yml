name: quote-assistant-exe-build

services:
  exe:
    build:
      context: ../..
      dockerfile: build/exe/Dockerfile
    image: quote-assistant-exe-builder
    user: "${PUID:-1000}:${PGID:-1000}"
    working_dir: /work
    environment:
      CARGO_HOME: /work/build/exe/cache/cargo
      CARGO_TARGET_DIR: /work/build/exe/cache/target
      HOME: /tmp
      XDG_CACHE_HOME: /work/build/exe/cache
    volumes:
      - ../..:/work
      - ../../dist:/dist
